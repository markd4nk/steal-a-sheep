<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Steal a Sheep: Daily Gifts</title>
<link rel="stylesheet" href="/DESIGN/ui/fleece.css">
<style>
/* Daily Gifts (Mark, 2026-10-05): check in every day for a better prize, a super rare sheep on day 7, then the week
   starts again. Two layouts (A: seven in a row; B: days 1-6 in a grid, day 7 big beside them), the flow in B, the day-7
   sheep's looks and the HUD button. The prizes scale with the player: cash is minutes of the pen's income, Climbing
   minutes of their stair walker, so every day is worth the same share at any point in the game. */

body.board { width: 1896px; }
.frame .dim { position: absolute; inset: 0; background: rgba(9, 12, 22, 0.45); }

/* A day's card: the day on top, the prize's picture, what it gives in the well at the bottom. Days ahead are blue,
   today gold with a glow, days claimed dark with a tick. */
.day { --cw: 108px; --ch: 119px; }
.day .dnum { position: absolute; left: 0; right: 0; top: 5px; text-align: center; font: 16px/1 var(--display); --sw: 4.5px; z-index: 2; }
.day .dpic { position: absolute; left: 50%; top: 23px; width: 64px; height: 64px; transform: translateX(-50%); object-fit: contain; filter: drop-shadow(0 3px 0 rgba(0, 0, 0, 0.22)); }
.day .token.dpic { top: 22px; }
.day .price { font-size: 17px; }
.day .price .lbl { paint-order: stroke fill; -webkit-text-stroke: 4px var(--ink); }
.t-climb { color: var(--gold); }
.t-lamb { color: #8fd4ff; }
.day.today {
	transform: translateY(-2px);
	box-shadow: 0 0 0 3px #fff, 0 0 0 5.5px var(--ink), 0 0 18px 6px rgba(255, 214, 70, 0.75), 0 7px 0 5.5px var(--ink),
		inset 0 2px 0 rgba(255, 255, 255, 0.5);
	z-index: 1;
}
.day.done { --t-hi: #4a5267; --t: #363d4e; --t-lo: #252a36; }
.day.done .dpic { opacity: 0.4; filter: grayscale(0.6); }
.day.done .dnum, .day.done .price .lbl { color: #9aa3b5; }
.tickdisc {
	position: absolute; left: 50%; top: 31px; transform: translateX(-50%); z-index: 3;
	width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
	background: linear-gradient(180deg, #7cf284, #2fbf3f 65%); box-shadow: 0 0 0 3px var(--ink), inset 0 -4px 0 #1d8a2b, inset 0 2px 0 rgba(255, 255, 255, 0.5);
}
.tickdisc svg { width: 28px; height: 28px; margin-bottom: 2px; }

/* Day 7: the sheep on a sky stage with rays, its name and SUPER RARE. */
.hero7 {
	position: relative; border-radius: 16px; overflow: hidden; flex: none;
	background: radial-gradient(ellipse 70% 55% at 50% 46%, rgba(255, 255, 255, 0.55), transparent 70%),
		linear-gradient(180deg, #8fd8ff, #6f86ff 55%, #8b55e8);
	box-shadow: 0 0 0 2.5px var(--ink), 0 5px 0 2.5px var(--ink), inset 0 2px 0 rgba(255, 255, 255, 0.55), inset 0 -5px 0 #5a2fb0;
}
.hero7::before { content: ""; position: absolute; inset: 0; background: var(--flock) 0 0 / 30px 27px; opacity: 0.1; }
.hero7 .rays { width: 520px; height: 520px; top: 46%; background: repeating-conic-gradient(rgba(255, 255, 255, 0.28) 0 9deg, transparent 9deg 22.5deg); }
.hero7 .dnum { position: absolute; left: 0; right: 0; top: 7px; text-align: center; font: 19px/1 var(--display); --sw: 5px; z-index: 2; }
.hero7 .peg { position: absolute; left: 50%; transform: translateX(-50%); object-fit: contain; filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.2)); z-index: 1; }
.hero7 .hname { position: absolute; left: 0; right: 0; text-align: center; font: 22px/1 var(--display); --sw: 6px; z-index: 2; white-space: nowrap; }
.rarechip {
	position: absolute; left: 50%; transform: translateX(-50%); z-index: 2;
	height: 24px; padding: 0 10px 2px; border-radius: 9px; display: flex; align-items: center;
	background: var(--rainbow); box-shadow: 0 0 0 2.5px var(--ink), inset 0 -3px 0 rgba(0, 0, 0, 0.2), inset 0 2px 0 rgba(255, 255, 255, 0.5);
	font: 14px/1 var(--display); color: #fff; letter-spacing: 0.04em; white-space: nowrap;
}
.rarechip .lbl { paint-order: stroke fill; -webkit-text-stroke: 4px var(--ink); }
.hero7.today { box-shadow: 0 0 0 3px #fff, 0 0 0 5.5px var(--ink), 0 0 22px 8px rgba(255, 214, 70, 0.8), 0 7px 0 5.5px var(--ink), inset 0 2px 0 rgba(255, 255, 255, 0.55), inset 0 -5px 0 #5a2fb0; }
.hero7 .spark { position: absolute; z-index: 2; }

/* B: the grid and the right column (day 7 over the button). */
.b-row { flex: 1; display: flex; gap: 12px; min-height: 0; }
.b-grid { display: grid; grid-template-columns: repeat(3, 108px); grid-auto-rows: 119px; gap: 8px 9px; padding-top: 1px; }
.b-col { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.b-col .hero7 { flex: 1; }
.b-col .hero7 .peg { top: 24px; width: 186px; height: 140px; }
.b-col .hero7 .hname { bottom: 34px; }
.b-col .hero7 .rarechip { bottom: 7px; }
.claim { --bh: 52px; font-size: 26px; }
.claim.off { font-size: 20px; gap: 6px; }
.claim .ico { width: 30px; height: 30px; }
.claim.off .lbl { color: #d7deeb; }

/* A: seven in a row, the button under them. */
.a-body { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.a-row { display: flex; gap: 7px; align-items: stretch; }
.a-row .day { --cw: 80px; --ch: 142px; }
.a-row .day .dpic { top: 30px; width: 58px; height: 58px; }
.a-row .day .tickdisc { top: 36px; }
.a-row .day .price { font-size: 15px; left: 5px; right: 5px; }
.a-row .hero7 { width: 152px; height: 142px; }
.a-row .hero7 .peg { top: 22px; width: 132px; height: 84px; }
.a-row .hero7 .hname { bottom: 31px; font-size: 17px; --sw: 5px; }
.a-row .hero7 .rarechip { bottom: 6px; height: 21px; font-size: 12px; }
.a-row .hero7 .dnum { font-size: 16px; top: 6px; }
.a-foot { display: flex; align-items: center; gap: 14px; }
.a-foot .claim { width: 250px; }

/* The day-7 pop-up: the sheep on its stage, its name, one line, one button. */
.pop .hdr .title { font-size: 30px; --sw: 7px; }
.pop .pbody { gap: 10px; padding: calc(var(--hh) + 14px) 14px 16px; }
.pop .hero7 { height: 140px; }
.pop .hero7 .peg { top: 6px; width: 200px; height: 112px; }
.pop .hero7 .dnum, .pop .hero7 .hname { display: none; }
.pop .hero7 .rarechip { bottom: 6px; }
.pop .pname { text-align: center; font: 30px/1 var(--display); --sw: 7px; margin-top: 2px; }
.pop .pline { text-align: center; font: 800 16px/1.1 var(--text); color: var(--muted); margin-top: -4px; }

/* The HUD's DAILY button, on a real screenshot (2x pixels): the golden calendar under SHEEPDEX, a red "!" and a gold
   glow while a gift waits, the countdown in place of its name once it's claimed. */
.hudshot { position: relative; overflow: hidden; border-radius: 14px; box-shadow: 0 0 0 3px #0a0d14, 0 12px 34px rgba(0, 0, 0, 0.55); flex: none; }
.hudshot > img.world { position: absolute; left: 0; top: 0; width: 1736px; height: 793px; max-width: none; }
.hudbtn { position: absolute; width: 140px; display: flex; flex-direction: column; align-items: center; }
.hudbtn .cal { width: 98px; height: 98px; filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.25)); position: relative; z-index: 1; }
.hudbtn .hlab { margin-top: -10px; font: 28px/1 var(--display); color: #fff; --sw: 7px; letter-spacing: 0.01em; position: relative; z-index: 2; white-space: nowrap; }
.hudbtn .hlab.timer { font-size: 25px; color: #fff; }
.hudbtn .halo { position: absolute; left: 50%; top: 48px; width: 170px; height: 170px; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(255, 220, 90, 0.85), rgba(255, 190, 40, 0.35) 45%, transparent 70%); }
.hudbtn .bang {
	position: absolute; right: 8px; top: -6px; width: 44px; height: 44px; border-radius: 50%; z-index: 3;
	display: grid; place-items: center; background: linear-gradient(180deg, #ff6b6b, #e02e33 65%);
	box-shadow: 0 0 0 4px #12131a, inset 0 -4px 0 #9c1a1d, inset 0 3px 0 rgba(255, 255, 255, 0.45);
	font: 30px/1 var(--display); color: #fff; padding-bottom: 3px;
}
.hudbtn .bang .lbl { paint-order: stroke fill; -webkit-text-stroke: 6px var(--ink); }

/* The board's own comparison of the day-7 looks (not part of the game). */
.looks { display: flex; gap: 26px; }
.looks figure { margin: 0; width: 380px; }
.looks .hero7 { width: 380px; height: 330px; }
.looks .hero7 .peg { top: 40px; width: 340px; height: 230px; }
.looks .hero7 .dnum { font-size: 24px; top: 10px; }
.looks .hero7 .hname { bottom: 44px; font-size: 28px; --sw: 7px; }
.looks .hero7 .rarechip { bottom: 12px; }
.looks figcaption { color: #b9c4d6; margin-top: 10px; font-size: 15px; }
.looks figcaption b { color: #fff; }

table.ladder { border-collapse: collapse; margin-top: 6px; font-size: 16px; }
table.ladder td, table.ladder th { padding: 6px 16px 6px 0; text-align: left; color: #b9c4d6; }
table.ladder th { color: #fff; font-weight: 700; }
table.ladder td b { color: #fff; }
</style>
</head>
<body class="board live" data-pending>
<script type="module">
import * as K from "/DESIGN/ui/kit.js";

const { short, ico, lbl, btn, panel, token } = K;

const PACK = (folder, stem) => `/pack/${folder}/256px/${stem} 256px.png`;
const CALENDAR = PACK("Item/Calendar", "Golden Calendar 1st Outline");
const CLOCK = PACK("Item/Clock", "Clock 1st Outline");
const LOCAL = (name) => `/DESIGN/ui/local/${name}.png`;
const PEGASUS = { gold: "/DESIGN/ui/assets/daily/pegasus-gold.png", white: "/DESIGN/ui/assets/daily/pegasus-white.png", halo: "/DESIGN/ui/assets/daily/pegasus-halo.png" };

// The sample player: data.json's flock (tiers 1-8 stolen from, 6,410 cash a second in the pen), a level-6 stair
// walker (Economy.WalkerRates: 9,000 Climbing a second) and Climbing past tier 8's sign (720K).
const INCOME = DATA_INCOME();
const WALKER = 9000;
const COINS = 2840000;
const CLIMB = 820000;
function DATA_INCOME() {
	return K.DATA.Flock.filter((sheep) => sheep.Slot > 0).reduce((sum, sheep) => sum + sheep.Income, 0);
}

// The week: cash is minutes of the pen's income, Climbing minutes of the stair walker, so each prize keeps its worth
// as the player grows. Day 4 is a Rare lamb from the highest god they've stolen from; day 7 the Pegasus Sheep.
const WEEK = [
	{ kind: "cash", minutes: 3, pic: LOCAL("cash1") },
	{ kind: "climb", minutes: 1, pic: LOCAL("climb1") },
	{ kind: "cash", minutes: 10, pic: LOCAL("cash3") },
	{ kind: "lamb", family: "Laurel" },
	{ kind: "climb", minutes: 3, pic: LOCAL("climb3") },
	{ kind: "cash", minutes: 30, pic: LOCAL("cash5") },
	{ kind: "pegasus" },
];
const amount = (prize) => (prize.kind === "cash" ? INCOME : WALKER) * prize.minutes * 60;

const TICK = `<svg viewBox="0 0 20 20"><path d="M4.5 10.5l3.6 3.6 7.4-8" fill="none" stroke="#12131a" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 10.5l3.6 3.6 7.4-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const sparkle = (left, top, size, color = "#ffe066") =>
	`<svg class="spark" style="left:${left}%;top:${top}%;width:${size}px;height:${size}px;--c1:${color}"><use href="#sparkle"/></svg>`;

// A day's state from the day the player is on: claimed before it, today (ready, or already claimed), ahead after.
function state(day, today, claimed) {
	if (day < today || (day === today && claimed)) {
		return "done";
	}
	return day === today ? "today" : "ahead";
}

function dayCard(index, today, claimed) {
	const prize = WEEK[index];
	const day = index + 1;
	const s = state(day, today, claimed);
	const tier = s === "today" ? "tier-legendary" : "tier-rare";
	let pic;
	let words;
	if (prize.kind === "lamb") {
		pic = token(prize.family, { size: 64, rarity: 2, extra: "dpic" });
		words = `<span class="lbl t-lamb">Rare lamb</span>`;
	} else {
		pic = `<img class="dpic" src="${prize.pic}" alt="">`;
		words = `<span class="lbl ${prize.kind === "cash" ? "t-cash" : "t-climb"}">+${short(amount(prize))}</span>`;
	}
	return `<div class="card day ${tier} ${s}">
		<div class="dnum ol">Day ${day}</div>
		${pic}
		<div class="price fit">${words}</div>
		${s === "done" ? `<div class="tickdisc">${TICK}</div>` : ""}
	</div>`;
}

function hero7(today, claimed, look = "gold", extra = "") {
	const s = today === 0 ? "ahead" : state(7, today, claimed);
	const done = s === "done";
	return `<div class="hero7 ${s} ${extra}" style="${done ? "filter:saturate(0.4) brightness(0.65)" : ""}">
		<div class="rays"></div>
		<div class="dnum ol">Day 7</div>
		<img class="peg" src="${PEGASUS[look]}" alt="">
		${sparkle(8, 22, 22)}${sparkle(80, 14, 17)}${sparkle(84, 52, 13, "#fff")}
		<div class="hname ol">Pegasus Sheep</div>
		<div class="rarechip">${lbl("SUPER RARE")}</div>
		${done ? `<div class="tickdisc" style="top:70px">${TICK}</div>` : ""}
	</div>`;
}

// The one button: Claim! while a gift waits, the countdown to the next once it's claimed.
function claimButton(claimed, wait = "19:59:58", width = "") {
	if (claimed) {
		return btn("off", `${ico(CLOCK, 28)}${lbl(`Next in ${wait}`)}`, { size: `claim ${width}` });
	}
	return btn("buy", lbl("Claim!"), { size: `claim ${width}`, state: "glow" });
}

const header = { accent: "daily", badge: CALENDAR, title: "Daily Gifts" };

// B: days 1-6 in a grid, day 7 big on the right over the button.
function layoutB({ today, claimed = false, notice = "", wait }) {
	const cards = WEEK.slice(0, 6).map((_, index) => dayCard(index, today, claimed)).join("");
	const body = `<div class="b-row">
		<div class="b-grid">${cards}</div>
		<div class="b-col">${hero7(today, claimed)}${claimButton(claimed, wait, "wide")}</div>
	</div>${notice}`;
	return panel({ ...header, w: 590, h: 330, body });
}

// A: seven in a row, the button under them.
function layoutA({ today, claimed = false }) {
	const cards = WEEK.slice(0, 6).map((_, index) => dayCard(index, today, claimed)).join("");
	const body = `<div class="a-body">
		<div class="a-row">${cards}${hero7(today, claimed)}</div>
		<div class="a-foot">${claimButton(claimed)}</div>
	</div>`;
	return panel({ ...header, w: 700, h: 282, body });
}

// Day 7's pop-up once it's claimed.
function pegasusPop() {
	const body = `${hero7(0, false, "gold")}
		<div class="pname ol">Pegasus Sheep</div>
		<div class="pline">In your pen now</div>
		${btn("buy", lbl("Awesome!"), { size: "wide", state: "glow" })}`;
	return panel({ w: 320, h: "auto", accent: "daily", badge: CALENDAR, title: "Day 7!", body, extra: "pop" });
}

const cashNotice = (value) => `<div class="notice">${ico("cash", 30)}${lbl(`+${short(value)} cash`)}</div>`;
const missedNotice = `<div class="notice bad">${lbl("Missed a day: back to Day 1")}</div>`;
const phone = (id, content, over, coins = COINS) => K.phoneFrame(id, content, { coins, climb: CLIMB, over });

// The HUD: the real screen (free-gift-claimed, 1736 x 793 at 2x), the DAILY button added under SHEEPDEX.
function hudButton(ready, x, y) {
	return `<div class="hudbtn" style="left:${x}px;top:${y}px">
		${ready ? `<div class="halo"></div>` : ""}
		<img class="cal" src="${CALENDAR}" alt="">
		<div class="hlab ol ${ready ? "" : "timer"}">${ready ? "DAILY" : "19:59:58"}</div>
		${ready ? `<div class="bang">${lbl("!")}</div>` : ""}
	</div>`;
}
function hudShot(id, ready, { w = 1736, h = 793, x = 0, y = 0 } = {}) {
	return `<div class="hudshot frame" data-id="${id}" data-w="${w}" data-h="${h}" data-scale="1" style="width:${w}px;height:${h}px">
		<img class="world" src="/DESIGN/ui/local/hud-screen.jpg" style="left:${-x}px;top:${-y}px" alt="">
		<div style="position:absolute;left:${-x}px;top:${-y}px">${hudButton(ready, 0, 497)}</div>
	</div>`;
}

const ladderRows = WEEK.map((prize, index) => {
	const what = {
		cash: () => `<b>${short(amount(prize))} cash</b></td><td>${prize.minutes} minutes of your pen's income`,
		climb: () => `<b>${short(amount(prize))} Climbing</b></td><td>${prize.minutes} minute${prize.minutes > 1 ? "s" : ""} of your stair walker`,
		lamb: () => `<b>A Rare lamb</b></td><td>from the highest god you've stolen from (here Athena's Laurel)`,
		pegasus: () => `<b>The Pegasus Sheep</b></td><td>only from Day 7; arrives as a lamb and earns like a Royal sheep of your highest god`,
	}[prize.kind]();
	return `<tr><td>Day ${index + 1}</td><td>${what}</td></tr>`;
}).join("");

K.boot(() => {
	document.body.innerHTML += `
	<div class="board-head">
		<div class="kicker">Steal a Sheep · mock-up · 2026-10-05</div>
		<h1>Daily Gifts</h1>
		<p>Come back every day for a better prize; <b>Day 7 is the Pegasus Sheep</b>, a super rare winged sheep you can only
		get here. Then the week starts again at Day 1. Prizes grow with the player: cash is minutes of their pen's income,
		Climbing minutes of their stair walker, so a day's gift is worth the same at the bottom of the mountain and at Zeus.
		Numbers below are for a player with tiers 1-8 stolen from (${short(INCOME)}/s in the pen, a level-6 walker).</p>
		<table class="ladder"><tr><th>Day</th><th>Prize</th><th>How much</th></tr>${ladderRows}</table>
	</div>
	<div class="section">
		<h2>Two layouts</h2>
		<p>Both on Day 4, Days 1-3 claimed. <b>A</b> lines the week up left to right, the usual Roblox calendar. <b>B</b> gives
		Day 7 its own big card next to the button, so the sheep is always the thing you see.</p>
		<div class="row">
			${K.shot(phone("a-day4", layoutA({ today: 4 })), "<b>A: seven in a row.</b>")}
			${K.shot(phone("b-day4", layoutB({ today: 4 })), "<b>B: grid, Day 7 big.</b>")}
		</div>
	</div>
	<div class="section">
		<h2>The week, in B</h2>
		<p>It pops up by itself once a session when a gift is waiting (never during the tutorial or a theft); after that the
		HUD's <b>DAILY</b> button opens it. Claiming cash flies the bills into the HUD's cash; the next gift opens 20 hours
		after a claim, and the streak keeps for 48.</p>
		<div class="row">
			${K.shot(phone("b-day1", layoutB({ today: 1 })), "<b>Day 1</b>, the first time.")}
			${K.shot(phone("b-day1-claimed", layoutB({ today: 1, claimed: true, notice: cashNotice(amount(WEEK[0])) }), undefined, COINS + amount(WEEK[0])), "<b>Claimed.</b> The button counts down to tomorrow.")}
		</div>
		<div class="row">
			${K.shot(phone("b-day7", layoutB({ today: 7 })), "<b>Day 7.</b> The sheep is today's prize.")}
			${K.shot(phone("b-day7-claimed", layoutB({ today: 7, claimed: true }), pegasusPop()), "<b>Day 7 claimed:</b> the Pegasus lamb hops into the pen.")}
		</div>
		<div class="row">
			${K.shot(phone("b-missed", layoutB({ today: 1, notice: missedNotice })), "<b>A day missed</b> (if a missed day restarts the week): back to Day 1.")}
		</div>
	</div>
	<div class="section">
		<h2>Day 7's sheep: which look?</h2>
		<p>The game's fluffy sheep in white with big feathered wings and gold hooves, rendered from the same meshes as the
		pen's sheep. Not built in the game yet.</p>
		<div class="looks">
			<figure>${hero7(0, false, "gold")}<figcaption><b>Gold-tipped wings</b> (used above)</figcaption></figure>
			<figure>${hero7(0, false, "white")}<figcaption><b>Sky-blue tips</b>, softer</figcaption></figure>
			<figure>${hero7(0, false, "halo")}<figcaption><b>Gold tips and a halo</b></figcaption></figure>
		</div>
	</div>
	<div class="section">
		<h2>On a computer</h2>
		<div class="row">${K.shot(K.pcFrame("b-pc", layoutB({ today: 4 }), { coins: COINS, climb: CLIMB }), "B on Day 4.")}</div>
	</div>
	<div class="section">
		<h2>The HUD button</h2>
		<p>The pack's golden calendar under SHEEPDEX, on a real screenshot. Glowing with a red <b>!</b> while a gift waits;
		the countdown in place of its name once it's claimed.</p>
		<div class="row">
			${K.shot(hudShot("hud-ready", true, { w: 420, h: 700, x: 0, y: 40 }), "<b>A gift is waiting.</b>")}
			${K.shot(hudShot("hud-waiting", false, { w: 420, h: 700, x: 0, y: 40 }), "<b>Claimed.</b> Back in 19:59:58.")}
		</div>
	</div>`;
});
</script>
</body>
</html>
